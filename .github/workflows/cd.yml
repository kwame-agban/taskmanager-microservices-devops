name: CD - Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push auth-service
        run: |
          docker build -t ghcr.io/${{ github.repository }}/auth-service:latest ./auth-service
          docker push ghcr.io/${{ github.repository }}/auth-service:latest

      - name: Build and push task-service
        run: |
          docker build -t ghcr.io/${{ github.repository }}/task-service:latest ./task-service
          docker push ghcr.io/${{ github.repository }}/task-service:latest

      - name: Build and push api-gateway
        run: |
          docker build -t ghcr.io/${{ github.repository }}/api-gateway:latest ./api-gateway
          docker push ghcr.io/${{ github.repository }}/api-gateway:latest

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:latest ./frontend-angular
          docker push ghcr.io/${{ github.repository }}/frontend:latest


  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/api-gateway -n taskmanager
          kubectl rollout status deployment/auth-service -n taskmanager
          kubectl rollout status deployment/task-service -n taskmanager
          kubectl rollout status deployment/frontend -n taskmanager
