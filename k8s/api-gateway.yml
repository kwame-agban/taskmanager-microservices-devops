apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: taskmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskmanager-config
                  key: AUTH_SERVICE_URL
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskmanager-config
                  key: TASK_SERVICE_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: taskmanager-config
                  key: FRONTEND_URL

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: taskmanager
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
