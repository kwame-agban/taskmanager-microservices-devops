apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taskmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SECURITY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: SECURITY_TOKEN_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taskmanager
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
