services:

  auth-db:
    image: postgres:15
    container_name: auth-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  task-db:
    image: postgres:15
    container_name: task-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: task_db
    ports:
      - "5434:5432"
    volumes:
      - task-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - auth-db

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: task-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-db:5432/task_db
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - task-db

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      TASK_SERVICE_URL: http://task-service:8082
      FRONTEND_URL: http://frontend-angular:80
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - task-service

  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  auth-db-data:
  task-db-data:
